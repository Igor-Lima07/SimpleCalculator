<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="calculator.png" type="image/png">


</head>
<body>
    <div id="mainContainer">
        
        <div id="displayContainer">
                <input id="displayText" readonly>
        </div>
        <div id="inputContainer">
            <div id="numberContainer">
                <button onclick="appendToDisplay('1')" class="numBtn" id="num1Btn">1</button>
                <button onclick="appendToDisplay('2')" class="numBtn" id="num2Btn">2</button>
                <button onclick="appendToDisplay('3')" class="numBtn" id="num3Btn">3</button>
                <button onclick="appendToDisplay('4')" class="numBtn" id="num4Btn">4</button>
                <button onclick="appendToDisplay('5')" class="numBtn" id="num5Btn">5</button>
                <button onclick="appendToDisplay('6')" class="numBtn" id="num6Btn">6</button>
                <button onclick="appendToDisplay('7')" class="numBtn" id="num7Btn">7</button>
                <button onclick="appendToDisplay('8')" class="numBtn" id="num8Btn">8</button>
                <button onclick="appendToDisplay('9')" class="numBtn" id="num9Btn">9</button>
                <button onclick="clearDisplay()" class="operatorBtn" id="cBtn">C</button>
                <button onclick="appendToDisplay('0')" class="numBtn" id="num0Btn">0</button>
                <button onclick="appendToDisplay('.')" class="operatorBtn" id="dotBtn">.</button>
            </div>
            <div id="operatorContainer">
                <button onclick="appendToDisplay('+')"class="operatorBtn" id="plusBtn">+</button>
                <button onclick="appendToDisplay('-')"class="operatorBtn" id="minusBtn">-</button>
                <button onclick="appendToDisplay('/')"class="operatorBtn" id="divideBtn">/</button>
                <button onclick="appendToDisplay('*')"class="operatorBtn" id="multiplyBtn">x</button>
                <button onclick="calculate()"class="operatorBtn" id="equalBtn">=</button>
            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
