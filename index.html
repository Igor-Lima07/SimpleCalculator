<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div id="mainContainer">
        
        <div id="displayContainer">
            <div id="display">
            </div>
        </div>
        <div id="inputContainer">
            <div id="numberContainer">
                <button class="numBtn" id="num1Btn">1</button>
                <button class="numBtn" id="num2Btn">2</button>
                <button class="numBtn" id="num3Btn">3</button>
                <button class="numBtn" id="num4Btn">4</button>
                <button class="numBtn" id="num5Btn">5</button>
                <button class="numBtn" id="num6Btn">6</button>
                <button class="numBtn" id="num7Btn">7</button>
                <button class="numBtn" id="num8Btn">8</button>
                <button class="numBtn" id="num9Btn">9</button>
                <button class="operatorBtn" id="cBtn">C</button>
                <button class="numBtn" id="num0Btn">0</button>
                <button class="operatorBtn" id="ceBtn">CE</button>
            </div>
            <div id="operatorContainer">
                <button class="operatorBtn" id="plusBtn">+</button>
                <button class="operatorBtn" id="minusBtn">-</button>
                <button class="operatorBtn" id="divideBtn">/</button>
                <button class="operatorBtn" id="multiplyBtn">x</button>
                <button class="operatorBtn" id="equalBtn">=</button>
            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
